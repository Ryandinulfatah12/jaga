version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  exclusions:
    rules:
      # Tests are full of fake camera URLs such as rtsp://admin:pass@cam/s.
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ryandinulfatah12/jaga
